<style>
:root{--bg:#ebeae6;--card:#fff;--ink:#1d2a33;--mut:#66727a;--line:#d6d4ce;--pri:#1f3a4d;--onpri:#fff;--acc:#f2b705;--ok:#2f7d4f;--bad:#b3392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171d21;--card:#212a30;--ink:#eceae4;--mut:#99a5ad;--line:#35414a;--pri:#f2b705;--onpri:#1d2a33;--acc:#f2b705;--ok:#58b57e;--bad:#e5786b}}
:root[data-theme="dark"]{--bg:#171d21;--card:#212a30;--ink:#eceae4;--mut:#99a5ad;--line:#35414a;--pri:#f2b705;--onpri:#1d2a33;--acc:#f2b705;--ok:#58b57e;--bad:#e5786b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,system-ui,sans-serif;max-width:640px;margin-inline:auto;padding:0 14px 90px}
h1,h2,h3{font-family:"Barlow Semi Condensed",Barlow,sans-serif;margin:0}
header{padding:18px 0 10px;border-bottom:4px solid var(--acc);margin-bottom:14px}
h1{font-size:30px;letter-spacing:.2px}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mut);padding:13px 4px;font:600 15px Barlow,sans-serif;border-top:3px solid transparent}
nav button[aria-selected="true"]{color:var(--ink);border-top-color:var(--acc)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.card h2{font-size:20px;margin-bottom:8px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:16px Barlow,sans-serif}
input:focus,select:focus,textarea:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:12px;padding:12px;border:0;border-radius:6px;background:var(--pri);color:var(--onpri);font:600 16px Barlow,sans-serif}
.btn.sec{background:none;color:var(--ink);border:1px solid var(--line)}
.x{border:0;background:none;color:var(--bad);font-size:14px;padding:4px 0}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}
.item b{font-weight:600}
.m{color:var(--mut);font-size:14px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.tag{font-size:13px;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}
.s-Siap{color:var(--ok);border-color:var(--ok)}.s-Sedang{color:#b07d00}.s-Belum{color:var(--mut)}
@media (prefers-color-scheme:dark){.s-Sedang{color:var(--acc)}}
.res{background:var(--bg);border-left:4px solid var(--acc);padding:8px 12px;margin-top:12px;border-radius:0 6px 6px 0}
.res div{display:flex;justify-content:space-between}
.res strong{font-family:"Barlow Semi Condensed",sans-serif;font-size:20px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:10px;padding:0 14px}
summary{padding:14px 0;font:700 19px "Barlow Semi Condensed",sans-serif;cursor:pointer}
details[open] summary{border-bottom:1px solid var(--line);margin-bottom:6px}
details>div{padding-bottom:14px}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.sum strong{display:block;font:700 24px "Barlow Semi Condensed",sans-serif}
.sum span{font-size:13px;color:var(--mut)}
.empty{color:var(--mut);text-align:center;padding:14px 0}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
td,th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{font-weight:600;color:var(--mut);font-size:13px}
.hide{display:none}

.row2{display:flex;gap:8px}.row2 input{flex:1}
.ths{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.th{position:relative}.pi{width:76px;height:76px;object-fit:cover;border-radius:6px;border:1px solid var(--line);background:var(--bg);display:block}
.rm{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--bad);color:#fff;font-size:14px;line-height:22px;padding:0}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:20;display:flex;align-items:center;justify-content:center}
#ov img{max-width:96%;max-height:92%}
#ov.hide{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 14px;border-radius:20px;font:600 15px Barlow,sans-serif}
.chip.on{background:var(--acc);border-color:var(--acc);color:#1d2a33}
.qp{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
#dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25;display:flex;align-items:center;justify-content:center;padding:20px}
#dlg.hide{display:none}
#dlg .box{background:var(--card);border-radius:10px;padding:18px;max-width:420px;width:100%}
#dlg p{margin:0 0 4px;font-size:17px}
.neg{color:var(--bad)}.item[data-sp]{cursor:pointer}
.wk summary .m{font-weight:400}
small{font-weight:400;opacity:.8}
.chip{display:inline-flex;align-items:center}
.av{width:36px;height:36px;border-radius:50%;object-fit:cover;background:var(--line);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font:700 15px Barlow,sans-serif;flex:none;margin:-4px 8px -4px -8px}
.av.big{width:60px;height:60px;font-size:24px;margin:0}
.phd{display:flex;gap:12px;align-items:center}
.phd h3{margin:0}
label.avl{display:block;margin:0;cursor:pointer}
label.avl2{display:flex;align-items:center;gap:8px;margin:10px 0 0;cursor:pointer}
label.avl2 .av{margin:0}
#avnew{display:inline-flex}
.av.sm{width:26px;height:26px;font-size:12px;margin:0 8px 0 0;vertical-align:middle}
.avl2{display:flex;align-items:center;gap:8px;margin:10px 0 0}
.avl2 .av{margin:0}
label.avc{display:flex;margin:0;cursor:pointer}
label.lnk{display:inline;margin:0 0 0 auto;color:var(--acc);font-size:14px;text-decoration:underline;cursor:pointer}
.m label.lnk{margin:0}
.avb{background:none;border:0;padding:0;cursor:pointer;display:flex}
#toast{pointer-events:none;z-index:60}
#cn{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;color:#fff;text-align:center;font:600 16px Barlow,sans-serif;text-shadow:0 1px 3px #000;pointer-events:none}
#cfb{text-align:center;padding:8px;background:#000}
label.lnk3{display:inline;margin:0;color:#f2b705;text-decoration:underline;font-size:14px;cursor:pointer}
#tdlg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:25;display:flex;align-items:center;justify-content:center;padding:20px}
#tdlg.hide{display:none}
#tdlg .box{background:var(--card);border-radius:10px;padding:18px;max-width:460px;width:100%;max-height:92vh;overflow:auto}
#tdlg textarea{font-size:14px}
.btn:disabled{opacity:.6}
#cam{position:fixed}
#cam{position:fixed;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}
#cam.hide{display:none}
#cam video{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.cbar{display:flex;gap:10px;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#000}
.cbar .btn{margin:0;flex:1}
.cbar #cshot{flex:2;background:#f2b705;color:#1d2a33}
.cbar .btn.sec{background:none;color:#fff;border-color:#777}
.fl{display:block;text-align:center;cursor:pointer}
.rr{display:grid;grid-template-columns:1fr 78px 78px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rr .x{display:block;padding:0;font-size:12px}
.fm{white-space:pre-line;font-size:14px;color:var(--mut);padding:6px 0}
.fm b{color:var(--ink)}
.in{border:0;padding:0;margin:8px 0 0;background:none}.in summary{font:600 15px Barlow,sans-serif;padding:8px 0;border:0!important;margin:0!important}
.ok strong{color:var(--ok)}.bad strong{color:var(--bad)}
.note{font-size:13px;color:var(--mut);margin:0 0 12px}
nav button{font-size:14px}
.bar2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar2 span{flex:1;min-width:120px}.bar2 .btn{width:auto;margin:0;padding:8px 14px;font-size:15px}
#toast{position:fixed;left:14px;right:14px;bottom:76px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:30;text-align:center;font-size:15px}
#toast.hide{display:none}
</style>

<body>
<header><h1>Buku Tapak</h1><p>Rekod kerja, pekerja, bahan dan beban</p></header>
<div id="bar" class="bar2"></div>
<main id="app"></main>
<div id="dlg" class="hide"><div class="box"><p id="dm"></p><div class="row"><button class="btn sec" id="dno">Batal</button><button class="btn" id="dyes" style="background:var(--bad);color:#fff">Ya, teruskan</button></div></div></div>
<div id="tdlg" class="hide"><div class="box"><h2>Tetapan team</h2><div class="m" id="tstat"></div>
<label>Config Firebase (tampal dari Firebase console)</label><textarea id="tcfg" rows="5" placeholder='const firebaseConfig = { apiKey: "...", projectId: "...", ... };'></textarea>
<label>Kod team (sama untuk semua ahli)</label><div class="row2"><input id="tcode" autocomplete="off"><button class="btn sec" id="tgen" style="margin:0;width:auto;padding:0 14px">Jana</button></div>
<button class="btn" id="tsave">Simpan dan sambung</button>
<button class="btn sec" id="tlink">Hantar link jemputan</button>
<label>Atau tampal link jemputan dari ketua team</label><div class="row2"><input id="tjoin" placeholder="https://...#join=..."><button class="btn sec" id="tjoinbtn" style="margin:0;width:auto;padding:0 14px">Sambung</button></div>
<div class="row"><button class="btn sec" id="toff">Putuskan</button><button class="btn sec" id="tclose">Tutup</button></div></div></div>
<div id="cam" class="hide"><video id="cv" autoplay playsinline muted></video><div id="cn"></div><div id="cfb"><label class="lnk3">Tak jadi? Guna kamera telefon<input type="file" accept="image/*" capture="environment" hidden id="camfile"></label></div><div class="cbar"><button class="btn sec" id="cx">Tutup</button><button class="btn" id="cshot">Ambil gambar</button><button class="btn sec" id="cflip">Tukar</button></div></div>
<div id="ov" class="hide"><img alt="gambar"></div>
<nav role="tablist">
<button role="tab" data-t="kerja">Kerja</button>
<button role="tab" data-t="pekerja">Pekerja</button>
<button role="tab" data-t="bahan">Bahan</button>
<button role="tab" data-t="stok">Stok</button>
<button role="tab" data-t="beban">Beban</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(n,d=2)=>(+n).toLocaleString("ms-MY",{maximumFractionDigits:d});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const b64e=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64d=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");return decodeURIComponent(escape(atob(s+"=".repeat((4-s.length%4)%4))))};
function joinFrom(txt){try{const m=String(txt).match(/#?join=([A-Za-z0-9_-]+)/);if(!m)return false;const o=JSON.parse(b64d(m[1]));if(o&&o.c&&o.c.apiKey&&o.t){localStorage.setItem("bt_cfg",JSON.stringify(o.c));localStorage.setItem("bt_team",o.t);return true}}catch(e){}return false}
try{if(location.hash.indexOf("join=")>-1){joinFrom(location.hash);history.replaceState(null,"",location.pathname+location.search)}}catch(e){}
const COL=["works","workers","mats","people","stock"];
const CFG=window.BT_CONFIG||{};
const FBC=(()=>{try{return JSON.parse(localStorage.getItem("bt_cfg")||"null")}catch(e){return null}})()||CFG.firebase||null;
let team=(localStorage.getItem("bt_team")||CFG.team||"").trim();
let S={works:[],workers:[],mats:[],people:[],stock:[]},FB=null,later=false,deferredInstall=null;
try{const r=localStorage.getItem("bt3");if(r){const o=JSON.parse(r);S.works=o.works||[];S.workers=o.workers||[];S.mats=o.mats||[];S.people=o.people||[];S.stock=o.stock||[]}}catch(e){}
const save=()=>{try{localStorage.setItem("bt3",JSON.stringify(S))}catch(e){}};
let tab=(()=>{try{const t=localStorage.getItem("bt_tab");return["kerja","pekerja","bahan","stok","beban"].includes(t)?t:"kerja"}catch(e){return"kerja"}})();
let tt;function toast(m){let e=$("#toast");if(!e){e=document.createElement("div");e.id="toast";document.body.appendChild(e)}e.textContent=m;e.className="";clearTimeout(tt);tt=setTimeout(()=>e.className="hide",4000)}
function put(c,o){const i=S[c].findIndex(x=>x.id===o.id);if(i>-1)S[c][i]=o;else S[c].push(o);save();
 if(FB)FB.ref(c).doc(o.id).set(JSON.parse(JSON.stringify(o))).catch(()=>toast("Gagal hantar ke team. Data kekal pada peranti ini."))}
function rem(c,id){S[c]=S[c].filter(x=>x.id!==id);save();if(FB)FB.ref(c).doc(id).delete().catch(()=>toast("Gagal padam di team."))}
const loadScript=src=>new Promise((ok,no)=>{const s=document.createElement("script");s.src=src;s.onload=ok;s.onerror=no;document.head.appendChild(s)});

/* ---------- Gambar: simpan pada peranti + hantar ke team (Firestore) ---------- */
const idb=new Promise(r=>{setTimeout(()=>r(null),4000);try{const q=indexedDB.open("bt",1);q.onupgradeneeded=()=>q.result.createObjectStore("ph");q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)}catch(e){r(null)}});
async function idbp(m,k,v){const d=await idb;if(!d)return null;return new Promise(r=>{setTimeout(()=>r(null),5000);try{const s=d.transaction("ph",m==="get"?"readonly":"readwrite").objectStore("ph");const q=m==="get"?s.get(k):m==="put"?s.put(v,k):s.delete(k);q.onsuccess=()=>r(q.result===undefined?0:q.result);q.onerror=()=>r(null)}catch(e){r(null)}})}
async function shrink(f){
 const b=await createImageBitmap(f);let max=1280,q=.72,blob;
 for(let i=0;i<5;i++){const s=Math.min(1,max/Math.max(b.width,b.height));const c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
  blob=await new Promise(r=>c.toBlob(r,"image/jpeg",q));if(blob.size<=600000)break;max*=.8;q-=.06}
 return blob}
const blobData=b=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(b)});
const pref=r=>r.includes(":")?r:"l:"+r;
async function putPhoto(b){
 const id=uid();const ok=await idbp("put",id,b);
 if(FB){try{await FB.ref("photos").doc(id).set({d:await blobData(b)});return "c:"+id}catch(e){toast("Gambar disimpan pada peranti ini sahaja (gagal ke team).")}}
 if(ok===null){urls[id]=URL.createObjectURL(b);toast("Gambar hanya disimpan sementara (simpanan telefon tak tersedia).")}return "l:"+id}
function rp(id){const r=pref(id),k=r.slice(2);idbp("del",k);if(r[0]==="c"&&FB)FB.ref("photos").doc(k).delete().catch(()=>{})}
const urls={};
function loadThumbs(){[...document.querySelectorAll("img[data-ph]:not([src])")].filter(i=>!i.closest("details.wk:not([open])")).forEach(async i=>{
 const r=pref(i.dataset.ph),id=r.slice(2);if(urls[id]){i.src=urls[id];return}
 const b=await idbp("get",id);if(b){urls[id]=URL.createObjectURL(b);i.src=urls[id];return}
 if(r[0]==="c"&&FB){try{const d=await FB.ref("photos").doc(id).get();if(d.exists){const u=d.data().d;urls[id]=u;i.src=u;fetch(u).then(x=>x.blob()).then(x=>idbp("put",id,x))}}catch(e){}}})}
const pend={n:[],p:[],av:""},colOf=k=>k==="w"?"works":"workers";
function getList(kind,owner){if(kind==="n"||kind==="p")return pend[kind];const o=S[colOf(kind)].find(x=>x.id===owner);return o?o.ph:[]}
const thumbs=(kind,owner)=>getList(kind,owner).map(id=>`<span class="th"><img class="pi" loading="lazy" data-ph="${id}"${phSrc(id)?` src="${phSrc(id)}"`:""} alt="gambar"><button class="rm" data-rm="${kind}:${owner}:${id}" aria-label="Buang gambar">×</button></span>`).join("");
const phBox=(kind,owner)=>`<div class="ths" id="ph-${kind}-${owner}">${thumbs(kind,owner)}</div><div class="row"><button class="btn sec fl" data-cam="add:${kind}:${owner}">📷 Ambil gambar</button><label class="btn sec fl">Galeri<input type="file" accept="image/*" multiple hidden data-add="${kind}:${owner}"></label></div>`;
function refreshPh(kind,owner){const e=document.getElementById(`ph-${kind}-${owner}`);if(e){e.innerHTML=thumbs(kind,owner);loadThumbs()}}

/* ---------- Kalkulator bahan ---------- */

const SK={"25x25x3":1.12,"40x40x3":1.83,"50x50x5":3.77,"65x65x6":5.91};
function pl(v){const wet=v.a*v.t/1000*(1+v.w/100),dry=wet*1.3,cv=dry/(1+ +v.r);return{b:Math.ceil(cv/0.0347),s:cv*v.r}}
const C=[
{id:"besi",n:"Besi tulangan",f:[["d","Diameter (mm)","16",["8","10","12","16","20","25"]],["len","Jumlah panjang (m)",100],["w","Lebihan / waste (%)",5]],
 fm:"Berat per meter = d² ÷ 162 (kg/m)\nPanjang + lebihan = panjang × (1 + waste%)\nBerat = panjang + lebihan × berat per meter\nBatang = panjang + lebihan ÷ 12",
 ex:"Y16, 100 m, waste 5%\nPanjang = 100 × 1.05 = 105 m\nBerat/m = 16² ÷ 162 = 1.58 kg/m\nBerat = 105 × 1.58 = 165.9 kg\nBatang = 105 ÷ 12 = 8.75, jadi 9 batang",
 r:v=>{const t=v.len*(1+v.w/100),kg=t*v.d*v.d/162;return[["Berat",fmt(kg)+" kg"],["Batang 12m",Math.ceil(t/12)+" batang"]]},
 s:v=>[["Besi Y"+v.d,Math.ceil(v.len*(1+v.w/100)/12),"batang 12m"]]},
{id:"konkrit",n:"Konkrit",f:[["p","Panjang (m)",5],["l","Lebar (m)",4],["t","Tebal (m)",0.15],["w","Lebihan (%)",5]],
 fm:"Isipadu = panjang × lebar × tebal × (1 + waste%)",
 ex:"5 m × 4 m × 0.15 m = 3.0 m³\nTambah waste 5%: 3.0 × 1.05 = 3.15 m³",
 r:v=>[["Isipadu",fmt(v.p*v.l*v.t*(1+v.w/100))+" m³"]],
 s:v=>[["Konkrit",+(v.p*v.l*v.t*(1+v.w/100)).toFixed(2),"m³"]]},
{id:"form",n:"Formwork (acuan)",f:[["p","Panjang (m)",10],["h","Tinggi sisi (m)",0.6],["k","Bilangan sisi",2],["w","Lebihan (%)",10]],
 fm:"Luas acuan = panjang × tinggi × bilangan sisi × (1 + waste%)\nKeping plywood = luas ÷ 2.98 (4x8 kaki = 2.98 m²)",
 ex:"Panjang 10 m, tinggi 0.6 m, 2 sisi\n10 × 0.6 × 2 = 12 m²\nTambah waste 10%: 13.2 m²\nPlywood = 13.2 ÷ 2.98 = 4.43, jadi 5 keping",
 r:v=>{const a=v.p*v.h*v.k*(1+v.w/100);return[["Luas acuan",fmt(a)+" m²"],["Plywood 4x8 kaki",Math.ceil(a/2.98)+" keping"]]},
 s:v=>[["Plywood 4x8",Math.ceil(v.p*v.h*v.k*(1+v.w/100)/2.98),"keping"]]},
{id:"plaster",n:"Plaster",f:[["a","Luas dinding (m²)",50],["t","Tebal (mm)",15],["r","Nisbah pasir (1 simen : ?)",4],["w","Lebihan (%)",10]],

 if(t.id==="sadd"){const n=$("#sn").value.trim(),u=$("#su").value.trim();if(!n){$("#sn").focus();return}
  const o=+$("#so").value||0,i=+$("#si").value||0,x=+$("#sx").value||0;
  let it=S.stock.find(z=>z.n.toLowerCase()===n.toLowerCase()&&(z.u||"").toLowerCase()===u.toLowerCase());
  it=it?Object.assign({},it,{o:it.o+o,i:it.i+i,x:it.x+x}):{id:uid(),n,u,o,i,x};
  put("stock",it);toast("Stok "+n+" dikemas kini.");render();return}
 if(t.id==="mclr"){S.mats.slice().forEach(m=>rem("mats",m.id));$("#matlist").innerHTML=matList()}
});
document.addEventListener("input",e=>{const d=e.target.closest("[data-c]");if(d)calc(d.dataset.c)});
document.addEventListener("change",async e=>{
 const t=e.target;
 if(t.id==="camfile"){
  const f=t.files[0];t.value="";if(!f||!camTarget)return;
  try{
   if(camTarget.t==="av"){let b;try{b=await shrinkAv(f)}catch(x){b=f}await setAvatarBlob(camTarget.id,b);closeCam()}
   else{let b;try{b=await shrink(f)}catch(x){b=f}if(await addPhotoBlob(camTarget.k,camTarget.o,b)){camCount++;$("#cn").textContent="✓ "+camCount+" gambar disimpan."}}
  }catch(x){toast("Gagal simpan gambar. Cuba lagi.")}
  return}
 if(t.dataset.av&&t.type==="file"){
  const id=t.dataset.av,f=t.files[0];t.value="";if(!f)return;
  let b;try{b=await shrinkAv(f)}catch(x){toast("Gambar tak dapat diproses.");return}
  const ref=await putPhoto(b);if(ref===null){toast("Gambar tak dapat disimpan.");return}
  if(id==="new"){if(pend.av)rp(pend.av);pend.av=ref;const e=$("#avnew");if(e){e.innerHTML=`<img class="av" data-ph="${ref}" alt="">`;loadThumbs()}}
  else{const p=S.people.find(x=>x.id===id);if(p){if(p.av)rp(p.av);put("people",Object.assign({},p,{av:ref}));render()}}
  return}
 if(t.dataset.add&&t.type==="file"){
  const[k,o]=t.dataset.add.split(":"),fs=[...t.files];t.value="";const l=getList(k,o);
  for(const f of fs){let b;try{b=await shrink(f)}catch(x){b=f}const id=await putPhoto(b);if(id===null){toast("Gambar tak dapat disimpan.");break}l.push(id)}
  if(k==="w"||k==="r"){const ob=S[colOf(k)].find(x=>x.id===o);if(ob)put(colOf(k),ob)}
  refreshPh(k,o)}
});
document.addEventListener("toggle",e=>{const d=e.target;if(d.dataset&&d.dataset.w!==undefined){d.open?(openW.add(d.dataset.w),loadThumbs()):openW.delete(d.dataset.w)}},true);
document.addEventListener("visibilitychange",()=>{if(document.hidden)stopCam();else if(!$("#cam").classList.contains("hide"))startCam().catch(()=>closeCam())});
render();init();
</script>
</body>
</html>
